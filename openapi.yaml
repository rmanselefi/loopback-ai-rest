openapi: 3.0.3
info:
  title: Loopback AI Interview API
  version: 1.0.0
  description: API for the Loopback AI-powered developer interview platform.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/interviews/:
    get:
      operationId: v1_interviews_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterviewSession'
          description: ''
  /api/v1/interviews/{session_id}/:
    get:
      operationId: v1_interviews_retrieve
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSession'
          description: ''
  /api/v1/interviews/{session_id}/answer/:
    post:
      operationId: v1_interviews_answer_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
          description: ''
  /api/v1/interviews/{session_id}/end/:
    post:
      operationId: v1_interviews_end_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSession'
          description: ''
  /api/v1/interviews/{session_id}/feedback/:
    get:
      operationId: v1_interviews_feedback_retrieve
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewFeedback'
          description: ''
  /api/v1/interviews/start/:
    post:
      operationId: v1_interviews_start_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInterviewSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartInterviewSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartInterviewSession'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSession'
          description: ''
components:
  schemas:
    CategoryEnum:
      enum:
      - dsa
      - system_design
      - behavioral
      - production_issue
      - tech_stack
      type: string
      description: |-
        * `dsa` - DSA
        * `system_design` - System Design
        * `behavioral` - Behavioral
        * `production_issue` - Production Issue
        * `tech_stack` - Tech Stack Specific
    InterviewFeedback:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
        overall_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        technical_accuracy_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        communication_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        problem_solving_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        depth_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        confidence_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        strengths: {}
        weaknesses: {}
        suggested_topics: {}
        summary:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - communication_score
      - confidence_score
      - created_at
      - depth_score
      - id
      - overall_score
      - problem_solving_score
      - session
      - summary
      - technical_accuracy_score
    InterviewMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
        transcript_text:
          type: string
          nullable: true
        audio_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        question_number:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
      - session
    InterviewSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        tech_stack:
          type: string
          nullable: true
          maxLength: 255
        level:
          $ref: '#/components/schemas/LevelEnum'
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        optional_topic:
          type: string
          nullable: true
          maxLength: 255
        status:
          $ref: '#/components/schemas/StatusEnum'
        overall_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InterviewMessage'
          readOnly: true
        feedback:
          allOf:
          - $ref: '#/components/schemas/InterviewFeedback'
          readOnly: true
      required:
      - category
      - created_at
      - ended_at
      - feedback
      - id
      - level
      - messages
      - overall_score
      - started_at
      - updated_at
      - user
    LevelEnum:
      enum:
      - junior
      - mid
      - senior
      - lead
      type: string
      description: |-
        * `junior` - Junior
        * `mid` - Mid
        * `senior` - Senior
        * `lead` - Lead
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - id
      - password
      - username
    RoleEnum:
      enum:
      - user
      - ai
      type: string
      description: |-
        * `user` - User
        * `ai` - AI
    StartInterviewSession:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        tech_stack:
          type: string
          nullable: true
          maxLength: 255
        level:
          $ref: '#/components/schemas/LevelEnum'
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        optional_topic:
          type: string
          nullable: true
          maxLength: 255
      required:
      - category
      - level
    StatusEnum:
      enum:
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    SubmitAnswer:
      type: object
      properties:
        content:
          type: string
      required:
      - content
    SubmitAnswerResponse:
      type: object
      properties:
        user_message:
          $ref: '#/components/schemas/InterviewMessage'
        ai_message:
          $ref: '#/components/schemas/InterviewMessage'
      required:
      - ai_message
      - user_message
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 255
      required:
      - email
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
